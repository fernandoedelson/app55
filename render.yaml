services:
  - type: web
    name: mais55-design
    runtime: docker
    plan: starter
    region: virginia           # a mais próxima do Brasil (a Render não tem São Paulo); não muda depois de criado
    autoDeploy: true           # todo push na main publica sozinho (decisão do dono em 20/10/2026)
    healthCheckPath: /saude
    envVars:
      - key: APP55_SECRET_KEY
        generateValue: true
      - key: APP55_DATA_DIR
        value: /app/data
      - key: APP55_TRUST_PROXY
        value: "1"
      - key: APP55_FORCE_HTTPS
        value: "1"
      - key: APP55_COOKIE_SEGURO
        value: "1"
      - key: APP55_ADMIN_LOGIN
        sync: false
      - key: APP55_ADMIN_SENHA
        sync: false
      - key: SMTP_HOST
        value: "smtp.gmail.com"
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: APP_BASE_URL
        sync: false
    disk:
      name: app55-data
      mountPath: /app/data
      sizeGB: 2
