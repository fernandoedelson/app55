<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ secao.titulo }} · +55 Design</title>
<link rel="icon" href="{{ url_for('static', filename='logo-chip.png') }}">
<meta name="csrf-token" content="{{ csrf_token() }}">
<link rel="stylesheet" href="{{ url_for('static', filename='relatorio/style2.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='relatorio/barra.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='dialogo.css') }}">
{% if cmt %}<link rel="stylesheet" href="{{ url_for('static', filename='comentarios.css') }}">{% endif %}
</head>
<body>
{% include '_barra_relatorio.html' %}
<main id="main">
  <section id="{{ secao.id }}"></section>
</main>
{% if cmt %}
{# a camada de comentário: o servidor diz, bloco a bloco, o que o leitor pode ver e fazer #}
<script type="application/json" id="cmt-config" data-api="{{ url_for('comentarios.api_detalhe', codigo=cmt.comp, bloco='X')[:-2] }}">{{ cmt|tojson }}</script>
{% endif %}
<script type="application/json" id="payload">{{ payload|safe }}</script>
<script src="{{ url_for('static', filename='relatorio/kit.js') }}"></script>
<script src="{{ url_for('static', filename='relatorio/destaques.js') }}"></script>
<script src="{{ url_for('static', filename='relatorio/destaques_texto.js') }}"></script>
<script src="{{ url_for('static', filename='relatorio/secoes/' + secao.id + '.js') }}"></script>
<script>
document.addEventListener('DOMContentLoaded',function(){
  const SID='{{ secao.id }}', COMP='{{ comp }}', RECURSOS={{ recursos|safe }};
  const P=JSON.parse(document.getElementById('payload').textContent);
  const sec=document.getElementById(SID);
  const url=(caminho,params)=>{ const q=new URLSearchParams(Object.assign({comp:COMP},params||{})); return caminho+'?'+q.toString(); };
  /* destaques: o servidor manda um por bloco; o texto é montado aqui e a régua os desenha */
  const carregarDestaques=p=>{ window.__DESTAQUES=window.DESTAQUES_TEXTO?DESTAQUES_TEXTO.carregar(p):{}; };
  carregarDestaques(P);
  const ctx={
    payload:P,
    pode:r=>RECURSOS.indexOf(r)>=0,
    buscar:async params=>{ const r=await fetch(url('/api/biblioteca/'+SID,params),{credentials:'same-origin'}); if(!r.ok) throw new Error(r.status);
      const p=await r.json(); carregarDestaques(p); return p; },
    detalhe:async (nome,params)=>{ const r=await fetch(url('/api/biblioteca/'+SID+'/detalhe/'+nome,params),{credentials:'same-origin'}); if(!r.ok) throw new Error(r.status); return r.json(); },
    /* o zoom de tabela redecora por observador (setTimeout 0): a marcação espera ele terminar */
    /* a régua entra antes da marcação: o digest nasce depois do sec-head e precisa herdar o bloco */
    remarcar:()=>setTimeout(()=>{ if(window.INSRT) INSRT.mount(sec); marcarEm(sec,{k:'__abre'}); },20),
    /* detalhe aberto no clique só remarca: no Kit o digest da seção não se refaz a cada clique */
    marcar:()=>setTimeout(()=>marcarEm(sec,{k:'__abre'}),20),
  };
  sec.innerHTML=DESENHO[SID](P,ctx);
  setupTableTools(); setupChartZoom(); setupLaser(); setupTableZoom();
  /* a marcação de blocos vem por último: o zoom de tabela embrulha cada tabela numa caixa nova,
     que precisa herdar o bloco (no Kit isso é feito por um observador que remarca a seção) */
  if(window.INSRT) INSRT.mount(sec);
  marcarEm(sec,{k:'__abre'});
  if(window.DESENHO_POS&&DESENHO_POS[SID]) DESENHO_POS[SID](sec,ctx);
});
</script>
<script src="{{ url_for('static', filename='dialogo.js') }}"></script>
{% if cmt %}<script src="{{ url_for('static', filename='comentarios.js') }}"></script>{% endif %}
</body>
</html>
