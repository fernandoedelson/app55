<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar · +55 Design</title>
<link rel="icon" href="{{ url_for('static', filename='logo-chip.png') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='tokens.css') }}">
<style>
  /* ------- A Sala: a porta da galeria ------- */
  body{overflow:hidden;background:radial-gradient(1100px 520px at 50% -8%,#3a2e24,#1a140f 60%,#120d09)!important;color:#f2eee4}
  .sala-bg{position:fixed;inset:0;opacity:.3;background:url('{{ url_for('static', filename=hero_img) }}') center/cover;filter:blur(60px) saturate(.6);pointer-events:none}
  .sala-scrim{position:fixed;inset:0;background:linear-gradient(180deg,rgba(18,13,9,.5),rgba(18,13,9,.4) 40%,rgba(18,13,9,.94));pointer-events:none}
  .sala-shell{position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px}
  .sala-logo{height:44px;width:auto;margin-bottom:44px;opacity:0;animation:fadeUp 1.1s var(--ease-lux) .15s forwards}
  @keyframes fadeUp{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
  @keyframes doorGlow{0%,100%{opacity:.5}50%{opacity:.85}}
  .porta{position:relative;width:400px;max-width:92vw;background:#0e0a07;border:1px solid rgba(227,205,182,.2);padding:16px;
    box-shadow:0 60px 100px -40px rgba(0,0,0,.9);opacity:0;animation:fadeUp 1.1s var(--ease-lux) .35s forwards}
  .porta::before{content:'';position:absolute;left:24%;right:24%;top:-52px;height:52px;
    background:linear-gradient(180deg,transparent,rgba(227,205,182,.16));clip-path:polygon(35% 0,65% 0,100% 100%,0 100%);
    animation:doorGlow 5s ease-in-out infinite}
  .porta-img{position:relative;overflow:hidden;height:150px}
  .porta-img .pi{position:absolute;inset:0;background:url('{{ url_for('static', filename=accent_img) }}') center 35%/cover}
  .porta-img::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(14,10,7,.85))}
  .porta-cap{position:absolute;left:18px;bottom:14px;right:18px;z-index:2}
  .porta-cap .k{font-size:10.5px;letter-spacing:.32em;text-transform:uppercase;color:#c9a284;font-weight:600}
  .porta-cap .t{font-family:var(--serif);font-size:21px;color:#fff;margin-top:4px}
  .porta-body{padding:28px 18px 18px}
  .porta-body .field label{color:#c9a284;letter-spacing:.24em;font-size:11.5px}
  .porta-body .field input{background:transparent;border:none;border-bottom:1px solid rgba(227,205,182,.3);border-radius:0;color:#fff;padding:9px 2px}
  .porta-body .field input:focus{box-shadow:none;border-bottom-color:#e3cdb6}
  .btn-porta{display:block;width:100%;text-align:center;justify-content:center;font-size:.72rem;letter-spacing:.32em;padding:16px;
    border:1px solid #e3cdb6;background:transparent;color:#e3cdb6}
  .btn-porta:hover{background:#e3cdb6;color:#120d09;transform:none}
  .porta-foot{margin:20px 0 0;text-align:center}
  .porta-foot a{font-size:12px;color:#8d8175;text-decoration:none;border-bottom:1px solid rgba(141,129,117,.4)}
  .sala-tag{font-family:var(--serif);font-style:italic;color:rgba(242,238,228,.55);font-size:15px;margin:38px 0 0;
    opacity:0;animation:fadeUp 1.1s var(--ease-lux) .6s forwards}
  .flashes{margin:0 18px}
  @media(max-width:520px){.porta{padding:12px}.porta-img{height:120px}}
  @media(prefers-reduced-motion:reduce){.sala-logo,.porta,.sala-tag{animation:none;opacity:1;transform:none}.porta::before{animation:none}}
</style>
</head>
<body>
<div class="sala-bg"></div>
<div class="sala-scrim"></div>
<div class="sala-shell">
  <img class="sala-logo" src="{{ url_for('static', filename='img/logo.png') }}" alt="+55 Design">
  <div class="porta">
    <div class="porta-img">
      <div class="pi"></div>
      <div class="porta-cap">
        <div class="k">Sala de resultados</div>
        <div class="t">Acesso privado</div>
      </div>
    </div>
    <div class="porta-body">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        <div class="flashes">{% for cat,msg in messages %}<div class="flash {{ cat }}">{{ msg }}</div>{% endfor %}</div>
        {% endif %}
      {% endwith %}
      <form method="post" action="{{ url_for('auth.login') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="field">
          <label for="username">Usuário</label>
          <input id="username" name="username" autocomplete="username" autofocus required>
        </div>
        <div class="field">
          <label for="password">Senha</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn btn-porta" type="submit">Entrar na sala</button>
      </form>
      <p class="porta-foot"><a href="{{ url_for('auth.esqueci_senha') }}">Esqueci minha senha</a></p>
    </div>
  </div>
  <p class="sala-tag">Feito por brasileiros, agora para o mundo.</p>
</div>
</body>
</html>
