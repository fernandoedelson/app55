services:
  - type: web
    name: app55
    runtime: docker
    plan: starter
    autoDeploy: false          # deploy manual: fora do expediente, nunca em dia de reunião
    healthCheckPath: /saude
    envVars:
      - key: APP55_SECRET_KEY
        generateValue: true
      - key: APP55_DATA_DIR
        value: /app/data
      - key: APP55_TRUST_PROXY
        value: "1"
      - key: APP55_FORCE_HTTPS
        value: "1"
      - key: APP55_COOKIE_SEGURO
        value: "1"
      - key: APP55_ADMIN_LOGIN
        sync: false
      - key: APP55_ADMIN_SENHA
        sync: false
      - key: SMTP_HOST
        value: "smtp.gmail.com"
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: APP_BASE_URL
        sync: false
    disk:
      name: app55-data
      mountPath: /app/data
      sizeGB: 5
