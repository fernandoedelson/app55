<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ secao.titulo }} · +55 Design</title>
<link rel="icon" href="{{ url_for('static', filename='logo-chip.png') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='relatorio/style2.css') }}">
</head>
<body>
<div class="app55-barra" style="display:flex;gap:16px;align-items:center;padding:10px 20px;font-size:.85rem">
  <a href="{{ url_for('inicio.index') }}">&larr; Início</a>
  <span>{{ secao.titulo }} · competência {{ comp }}</span>
</div>
<main id="main">
  <section id="{{ secao.id }}"></section>
</main>
<script type="application/json" id="payload">{{ payload|safe }}</script>
<script src="{{ url_for('static', filename='relatorio/kit.js') }}"></script>
<script src="{{ url_for('static', filename='relatorio/secoes/' + secao.id + '.js') }}"></script>
<script>
document.addEventListener('DOMContentLoaded',function(){
  const SID='{{ secao.id }}', COMP='{{ comp }}', RECURSOS={{ recursos|safe }};
  const P=JSON.parse(document.getElementById('payload').textContent);
  const sec=document.getElementById(SID);
  const url=(caminho,params)=>{ const q=new URLSearchParams(Object.assign({comp:COMP},params||{})); return caminho+'?'+q.toString(); };
  const ctx={
    payload:P,
    pode:r=>RECURSOS.indexOf(r)>=0,
    buscar:async params=>{ const r=await fetch(url('/api/biblioteca/'+SID,params),{credentials:'same-origin'}); if(!r.ok) throw new Error(r.status); return r.json(); },
    detalhe:async (nome,params)=>{ const r=await fetch(url('/api/biblioteca/'+SID+'/detalhe/'+nome,params),{credentials:'same-origin'}); if(!r.ok) throw new Error(r.status); return r.json(); },
    /* o zoom de tabela redecora por observador (setTimeout 0): a marcação espera ele terminar */
    remarcar:()=>setTimeout(()=>marcarEm(sec,{k:'__abre'}),20),
  };
  sec.innerHTML=DESENHO[SID](P,ctx);
  setupTableTools(); setupChartZoom(); setupTableZoom();
  /* a marcação de blocos vem por último: o zoom de tabela embrulha cada tabela numa caixa nova,
     que precisa herdar o bloco (no Kit isso é feito por um observador que remarca a seção) */
  marcarEm(sec,{k:'__abre'});
  if(window.DESENHO_POS&&DESENHO_POS[SID]) DESENHO_POS[SID](sec,ctx);
});
</script>
</body>
</html>
